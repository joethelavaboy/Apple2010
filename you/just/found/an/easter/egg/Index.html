<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasterEgg</title>
  <style>
    /* Reset default spacing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f4f9;
      color: #333;
    }

    /* Top Navigation Bar */
    header {
      background-color: #1e293b;
      color: #ffffff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-content: center;
    }

    /* Middle Main Content Area */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* Placeholder Image Container */
    .image-placeholder {
      width: 100%;
      max-width: 600px;
      height: 350px;
      background-color: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-weight: 600;
    }

    /* Bottom Footer Bar */
    footer {
      background-color: #1e293b;
      color: #ffffff;
      text-align: center;
      padding: 1rem 2rem;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div><strong>Easter Egg found!!!</strong></div>
    <div>Top Bar Navigation Placeholder</div>
  </header>

  <!-- Middle Content -->
  <main>
<!-- Middle Content -->
  <main>
    <!-- Replace the placeholder <div> with your <img> tag -->
    <img src="https://pngimg.com/uploads/easter/easter_PNG293.png" alt="Placeholder Image" style="max-width: 100%; height: auto; border-radius: 8px;">
  </main>
  </main>
<!-- Custom Button -->
<style>
  .btn-custom {
    background-color: #1e293b;
    color: #ffffff;
    padding: 10px 24px;
    font-size: 2-px;
    font-weight: 600;
    border: 50px;
    border-radius: 0px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  .btn-custom:hover {
    background-color: ##3a424f;
    transform: translateY(-2px);
  }

  .btn-custom:active {
    transform: translateY(0);
  }
</style>

<button class="btn-custom" type="button">Home</button>
  <!-- Bottom Bar -->
  <footer>
    <p>Congrats</p>
  </footer>
</body>
</html>
